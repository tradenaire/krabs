[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning

# ВАЖНО: запускать с PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 -p pytest_asyncio.plugin
# чтобы обойти системный langsmith pytest-plugin (pydantic v1 + Python 3.12+
# несовместимы). Команда:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q
# Если запускать в чистом venv (на проде) — env var не нужен.
